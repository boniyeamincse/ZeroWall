# ZeroWall - Runtime Sysctl Tunables
# Applied via sysctl -f /etc/sysctl.conf

# Security Hardening
net.inet.ip.redirect=0
net.inet.ip.sourceroute=0
net.inet.ip.accept_sourceroute=0
net.inet.icmp.log_redirect=0
net.inet.icmp.drop_redirect=1
net.inet.ip.stealth=1
net.inet.tcp.path_mtu_discovery=1
net.inet.tcp.drop_synfin=1

# IP Forwarding
net.inet.ip.forwarding=1
net.inet.ipv6.forwarding=1

# Fast Forwarding (Try to bypass full stack packet processing)
net.inet.ip.fastforwarding=1

# TCP Performance
net.inet.tcp.sackedelay=0
net.inet.tcp.recvbuf_auto=1
net.inet.tcp.sendbuf_auto=1
net.inet.tcp.recvbuf_inc=16384
net.inet.tcp.sendbuf_inc=16384
net.inet.tcp.recvbuf_max=16777216
net.inet.tcp.sendbuf_max=16777216
net.inet.tcp.recvspace=65536
net.inet.tcp.sendspace=65536
net.inet.tcp.mssdflt=1440
net.inet.tcp.abc=2

# TCP Timestamps and RTT
net.inet.tcp.timestamps=1
net.inet.tcp.rtt7809=1

# SYN Cache and SYN Cookies
net.inet.tcp.syncookies=1
net.inet.tcp.syncache.hashsize=4096
net.inet.tcp.syncache.bucketlimit=100

# TCP Blackhole (drop invalid packets)
net.inet.tcp.blackhole=2
net.inet.udp.blackhole=1

# Keepalive
net.inet.tcp.keepidle=60000
net.inet.tcp.keepintvl=60
net.inet.tcp.keepcnt=3

# Connection Limits
kern.ipc.maxsockbuf=16777216
kern.ipc.nmbclusters=262144
kern.ipc.somaxconn=1024

# pf State Limits
net.pf.filter_local=1
net.pf.request_maxcount=100000
net.pf.states_hashsize=65536

# UNIX Domain Socket Performance (for zwapi <-> zwconfigd)
net.local.stream.recvspace=65536
net.local.stream.sendspace=65536

# IP Fragmentation
net.inet.ip.maxfragsperpacket=16
net.inet.ip.fragment_queue_max_len=8192

# IGMP
net.inet.igmp.default_version=3

# CARP (High Availability)
net.inet.carp.preempt=1
net.inet.carp.log=1

# Wireless
net.link.wlan.debug=0

# Randomness
kern.random.sys.harvest_interrupt=1
kern.random.sys.harvest_point_to_point=1
