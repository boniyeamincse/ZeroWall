# ZeroWall - Kernel Loader Tunables
# Performance and Security optimizations for FreeBSD 14.x

# Network Interrupt Handling
net.isr.dispatch=deferred
net.isr.maxthreads=-1
net.isr.bindthreads=1

# TCP/IP Stack Limits
net.inet.tcp.blackhole=2
net.inet.udp.blackhole=1

# Increase ephemeral port range
net.inet.ip.portrange.first=1024
net.inet.ip.portrange.last=65535

# pf Performance Tuning
net.pf.states_hashsize=2097152
net.pf.source_nodes_hashsize=65536

# Hardware Offloading (Optional, hardware dependent)
# If using Intel NICs (em/igb/ix/ixl)
# hw.igb.max_interrupt_rate=32000
# hw.ix.max_interrupt_rate=32000

# Kernel memory for mbufs
# nmbclusters="1048576"
